# Recomputes the 'Uptime' line of dark_mode.svg / light_mode.svg every night
# and commits the result. No secrets and no API calls: the only moving part is
# today's date.
name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# lets the built-in GITHUB_TOKEN push the rebuilt SVGs back to the branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update the SVGs
        run: python today.py

      - name: Commit
        run: |-
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          git add .
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push
